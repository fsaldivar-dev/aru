<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ARU · Rendimiento del workspace</title><style>body{margin:0;background:#18201e;color:#eee9de;font:14px system-ui}header,main{padding:16px}h1{font-size:22px;margin:0 0 8px}button,select{font:inherit;background:#e8b776;color:#18201e;border:0;border-radius:7px;padding:9px;margin:4px}#editor{height:620px;border:1px solid #4c5a55}pre{white-space:pre-wrap;font:12px monospace;background:#111816;padding:12px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:7px;border-bottom:1px solid #49524b}#status{color:#e8b776}</style><header><h1>ARU · Prueba de rendimiento</h1><div>Instrumentos reales repetidos en un documento aislado. No modifica tus proyectos.</div><button disabled id="run">Medir 100, 300 y 1.000 iconos</button><button disabled id="verify">Verificar selección y edición</button><button disabled id="inspect">Inspeccionar icono central</button><button disabled id="materials">Medir con Fruits</button><button disabled id="soak">Ciclos de selección y recarga</button><select id="size" aria-label="Cantidad"><option>100</option><option>300</option><option>1000</option></select><button disabled id="load">Cargar para inspeccionar</button><p id="status">Preparando editor…</p></header><div id="editor"></div><main><table><thead><tr><th>Iconos</th><th>Operación</th><th>ms</th><th>Bloqueo máx.</th></tr></thead><tbody id="rows"></tbody></table><pre id="report">{}</pre></main><script type="module">
import {mountEditor} from '/plugin/embed.js';
const api=mountEditor(document.querySelector('#editor'),{timeout:120000});await api.ready;
const doc=api.element.contentDocument,win=api.element.contentWindow;
const report={userAgent:navigator.userAgent,viewport:[innerWidth,innerHeight],rows:[],soak:[]};let tasks=[];let observer;
try {observer=new win.PerformanceObserver(list=>tasks.push(...list.getEntries().map(e=>({start:e.startTime,duration:e.duration}))));observer.observe({type:'longtask',buffered:false});}catch{}
const paint=()=>new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
const status=s=>document.querySelector('#status').textContent=s;
const publish=()=>{document.querySelector('#report').textContent=JSON.stringify(report,null,2);document.querySelector('#rows').innerHTML=report.rows.map(r=>`<tr><td>${r.count}</td><td>${r.operation}</td><td>${r.ms.toFixed(1)}</td><td>${r.maxLongTaskMs.toFixed(1)}</td></tr>`).join('');};
async function measure(count,operation,fn){await paint();const canvasBefore=doc.querySelector('#art svg');let viewportWrites=0;const viewportObserver=new win.MutationObserver(entries=>{viewportWrites+=entries.length;});viewportObserver.observe(canvasBefore,{attributes:true,attributeFilter:['width','height']});const t=win.performance.now();const result=await fn();await paint();const end=win.performance.now();viewportWrites+=viewportObserver.takeRecords().length;viewportObserver.disconnect();const long=tasks.filter(e=>e.start>=t&&e.start<end);const row={count,operation,ms:end-t,maxLongTaskMs:Math.max(0,...long.map(e=>e.duration)),longTaskCount:long.length,viewportWrites,canvasReplaced:canvasBefore!==doc.querySelector('#art svg'),domNodes:doc.querySelectorAll('*').length,layerRows:doc.querySelectorAll('#layers .row').length,heapMB:win.performance.memory?win.performance.memory.usedJSHeapSize/1048576:null};report.rows.push(row);publish();return result;}
const fixture=count=>fetch(`/out/workspace-performance-2026-10-07/${count}.aru`).then(r=>r.text());
async function load(count){await api.load(await fixture(count),`${count} instrumentos · rendimiento`);await paint();}
document.querySelector('#load').onclick=async()=>{await load(+document.querySelector('#size').value);status('Documento de prueba cargado. Puedes seleccionar, arrastrar, acercar y desplazar.');};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;report.rows=[];try{for(const count of [100,300,1000]){status(`Midiendo ${count} iconos…`);const text=await fixture(count);await measure(count,'load',()=>api.load(text,`${count} instrumentos · rendimiento`));for(let k=0;k<3;k++)await measure(count,'select-one',()=>api.select([`instrument_${count-1-k}`]));await measure(count,'select-100',()=>api.select(Array.from({length:100},(_,i)=>`instrument_${i}`)));await measure(count,'context',()=>api.context());await measure(count,'move',()=>api.apply([{op:'translate',target:'instrument_0',dx:2,dy:1}]));await measure(count,'undo',()=>api.undo());await api.select([]);await measure(count,'pan-20',async()=>{const stage=doc.querySelector('#stage');for(let k=0;k<20;k++){stage.dispatchEvent(new win.WheelEvent('wheel',{deltaX:2,deltaY:2,bubbles:true,cancelable:true}));await new Promise(r=>win.requestAnimationFrame(r));}});}
status('Medición terminada.');}catch(e){report.error=e.message;status(e.message);}finally{publish();document.querySelector('#run').disabled=false;}};
document.querySelector('#soak').onclick=async()=>{document.querySelector('#soak').disabled=true;try{for(let cycle=0;cycle<8;cycle++){status(`Ciclo ${cycle+1}/8…`);await load(1000);for(let k=0;k<12;k++)await api.select([`instrument_${999-k}`]);await load(100);await paint();report.soak.push({cycle,domNodes:doc.querySelectorAll('*').length,heapMB:win.performance.memory?win.performance.memory.usedJSHeapSize/1048576:null});publish();}status('Ciclos terminados. Memoria observada, sin forzar GC.');}finally{document.querySelector('#soak').disabled=false;}};
document.querySelector('#inspect').onclick=async()=>{await load(1000);await api.select(['instrument_512']);for(let i=0;i<6;i++)doc.querySelector('#zoomIn').click();status('Instrumento 513 seleccionado para inspección y arrastre.');};
document.querySelector('#verify').onclick=async()=>{
 const checks=[];const check=(name,condition)=>{checks.push({name,passed:!!condition});if(!condition)throw new Error('Falla: '+name);};
 try{
  await load(1000);const before=await api.getDocument(),canvas=doc.querySelector('#art svg');
  await api.select(['instrument_999']);await paint();check('Selección conserva el SVG montado',canvas===doc.querySelector('#art svg'));
  check('Fila seleccionada fuera de la ventana inicial queda accesible',!!doc.querySelector('#layers .row.sel[data-path="instrument_999"]'));
  try{await api.select(['inexistente']);check('Selección inválida rechazada',false);}catch(e){check('Selección inválida rechazada',/inválida/.test(e.message));}
  check('Selección inválida conserva selección anterior',(await api.context()).selection[0]==='instrument_999');
  const layers=doc.querySelector('#layers');layers.scrollTop=layers.scrollHeight;await paint();check('Scroll llega al primer icono lógico',!!doc.querySelector('#layers [data-path="instrument_0"]'));check('Filas montadas acotadas',doc.querySelectorAll('#layers .row').length<60);
  await api.select(['instrument_512']);for(let i=0;i<5;i++)doc.querySelector('#zoomIn').click();await paint();
  const context=await api.context();check('Contexto completo conserva las 9.950 capas',context.layers.length===9950);
  const oldBounds=context.layers.find(n=>n.path==='instrument_512').bounds;
  await api.apply([{op:'translate',target:'instrument_512',dx:10,dy:2}]);const after=await api.context(),box=after.layers.find(n=>n.path==='instrument_512').bounds;
  check('Mover actualiza límites medidos',Math.abs(box[0]-oldBounds[0]-10)<.1&&Math.abs(box[1]-oldBounds[1]-2)<.1);
  await api.undo();check('Deshacer restaura el texto exacto',(await api.getDocument()).text===before.text);
  await api.redo();check('Rehacer restaura la edición',(await api.getDocument()).text!==before.text);
  status('Verificación de edición terminada.');
 }catch(e){status(e.message);report.verificationError=e.message;}finally{report.checks=checks;publish();}
};
document.querySelector('#materials').onclick=async()=>{document.querySelector('#materials').disabled=true;try{for(const count of [100,300]){status(`Midiendo Fruits con ${count} iconos…`);const text=await fetch(`/out/workspace-performance-2026-10-07/${count}-fruits.aru`).then(r=>r.text());await measure(count,'fruits-load',()=>api.load(text,`${count} instrumentos · Fruits`));await measure(count,'fruits-select-one',()=>api.select([`instrument_${count-1}`]));await api.select([]);await measure(count,'fruits-pan-20',async()=>{for(let k=0;k<20;k++){doc.querySelector('#stage').dispatchEvent(new win.WheelEvent('wheel',{deltaX:2,deltaY:2,bubbles:true,cancelable:true}));await new Promise(r=>win.requestAnimationFrame(r));}});}status('Medición con Fruits terminada.');}catch(e){report.materialError=e.message;status(e.message);}finally{document.querySelector('#materials').disabled=false;publish();}};
document.querySelectorAll('header button').forEach(b=>b.disabled=false);
status('Listo para medir.');
</script></html>
